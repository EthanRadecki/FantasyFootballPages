<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="icon" type="image/png" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body>

<div class="bg-wrap"><div class="bg-grain"></div><div class="bg-gradient"></div></div>

<div class="content">

  <nav class="glass" id="site-nav"></nav>
  <div class="mobile-menu" id="mobile-menu"></div>

  <div class="hero glass" id="hero"></div>

  <a class="champ-banner glass" id="champion" hidden></a>

  <div class="home-leaderboard" id="leaderboard">
    <div class="section-heading">
      <h2>All-Time Leaderboard</h2>
      <p id="leaderboard-note">Click any column to sort</p>
    </div>
    <div class="table-wrap glass lb-table-wrap">
      <table class="lb-table" id="leaderboardTable">
        <thead></thead>
        <tbody><tr><td colspan="99"><div class="data-state data-state-loading">Loading&hellip;</div></td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="nav-grid" id="cards"></div>

  <footer id="site-footer"></footer>

</div>

<script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
