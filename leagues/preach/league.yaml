# Preach Fantasy league config (DRAFT, phase 1)
#
# Everything league-specific lives here, never in engine or web code.
# Validate with:  engine config check leagues/preach/league.yaml
#
# Only facts ESPN cannot supply belong here (seasons played, team names, and
# records come from ESPN). Items marked TODO need filling in. Manager ids come from
# tools/espn_members.py (run locally; needs your ESPN cookies). They are
# hashed keys, never raw ESPN member ids (see engine/identity.py).

league:
  name: Preach Fantasy
  provider: espn
  league_id: 9954376
  first_season: 2020
  logo:
    by_season: images/logos/league/preach_logo_{season}.png   # moves to leagues/preach/assets in phase 5

rules:
  regular_season_weeks:
    default: 14
    2020: 13
    2021: 13
  playoff_round_names:
    2020: ["The Round of 15"]          # TODO: remaining 2020 round names, and 2021 if it differs
    default: [Quarterfinals, Semifinals, Championship]
  scoring_modifications:
    dst_floor_zero: true               # negative D/ST scores floored at 0
  faab_budget: 300                     # resets annually, tradeable

managers:
  - name: Ethan Radecki
    id: m_75b9d7bd54e4
    color: "#ea9a2e"
    logo: { default: images/logos/Radecki.png, 2020: images/logos/Radecki2020.png }
