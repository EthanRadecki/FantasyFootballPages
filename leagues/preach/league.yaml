# Colors: the site uses two palettes. "dark" is the one most pages use;
# "light" is the full-name palette on index and managers. Three stray values
# (Gorman #9f8bc2, Gegwich #ad1f15, McQuaid #dfc983) are page-level
# inconsistencies, fixed in phase 4 when pages read colors from here.
# championship_logos: the alternate logo a manager earned by winning that season.

corrections:
  draft_order:    # true draft order, slot 1 first, where ESPN's is wrong
    2021: [andrew-root, deniz-bileydi, ben-castaldo, charlie-gorman, baylen-slansky, ryan-mcquaid, cole-maney,
           ethan-radecki, carmine-pittelli, aidan-quigley, max-malich, brandon-hancock, quin-gegwich, anthony-kelly]
           # drafted offline; ESPN has the right players on the right managers, but its pick
           # numbers come from the wrong order (e.g. Kelce was Kelly's 14th pick, not 2nd)
  draft_pick_owners:   # picks traded during the draft that ESPN still credits to the original owner
    2026: { 92: ethan-radecki, 105: ethan-radecki, 98: deniz-bileydi, 99: deniz-bileydi }
          # Radecki and Bileydi swapped their 7th and 8th round picks

analysis:
  record_games: [regular_season, winners_bracket]   # consolation games never count toward records or stats
  exclude_managers: [thomas-sullivan, william-serafin]   # 2020-only: counted in every calculation, hidden from view
  playoff_odds:
    cutoff: 8     # top 8 count as making the playoffs (real brackets: 15 teams in 2020, 9 in 2021, 8 since)
  exclude_games:
    - { manager: ben-castaldo, season: 2024, week: 14, from: [ppg] }   # sat lineup; loss still counts
  adp:
    library: fantasypros_ppr    # engine/data/adp/: market ADP by season, PPR, for seasons without a draft-day ESPN copy
    snapshot_max_days: 3        # ESPN's own ADP is used only if engine pull saved it within 3 days of the draft

legacy:                             # Stage A (docs/PUBLISH_PLAN.md); removed at cutover (phase 6)
  site_template: true               # build dist/ on the current site files and write their legacy data views
  golden_dir: engine/tests/golden   # the legacy files `--verify` checks the engine against

features:
  weekly_rankings: true
  champions_gallery: true

theme:
  fonts: { body: Outfit, display: Playfair Display }
  season_colors:            # primary color per season; page-specific shades move here in phase 4
    2020: "#a4969d"
    2021: "#8a93ab"
    2022: "#d8b28e"
    2023: "#bf8f8f"
    2024: "#9aadae"
    2025: "#a9b88b"
    2026: "#c292b8"
