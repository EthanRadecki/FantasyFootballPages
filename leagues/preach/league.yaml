    logo: images/logos/Quigley.png
  - name: Brandon Hancock
    id: m_4a52e2a2e6e5
    colors: { dark: "#416cab", light: "#4875b9" }
    logo: images/logos/Hancock.png
  - name: Ryan McQuaid
    id: m_a4c987aba844
    aliases: ["Ryan P McQuaid"]
    colors: { dark: "#bd0517", light: "#d76974" }
    logo: images/logos/McQuaid.png
  - name: Cole Maney
    id: m_22dd02175159
