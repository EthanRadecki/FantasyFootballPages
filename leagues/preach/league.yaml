# Colors: the site uses two palettes. "dark" is the one most pages use;
# "light" is the full-name palette on index and managers. Three stray values
# (Gorman #9f8bc2, Gegwich #ad1f15, McQuaid #dfc983) are page-level
# inconsistencies, fixed in phase 4 when pages read colors from here.
# championship_logos: the alternate logo a manager earned by winning that season.

analysis:
  exclude_managers: [thomas-sullivan, william-serafin]   # 2020-only, excluded from surplus analyses
  exclude_games:
    - { manager: ben-castaldo, season: 2024, week: 14, from: [ppg] }   # sat lineup; loss still counts

features:
  weekly_rankings: true
  champions_gallery: true

theme:
  fonts: { body: Outfit, display: Playfair Display }
  season_colors:            # primary color per season; page-specific shades move here in phase 4
    2020: "#a4969d"
    2021: "#8a93ab"
    2022: "#d8b28e"
    2023: "#bf8f8f"
    2024: "#9aadae"
    2025: "#a9b88b"
    2026: "#c292b8"
