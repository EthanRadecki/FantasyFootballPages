# Draft archetype names (draft-fingerprints.html), editorial (decision 7.6).
#
# Keyed by the engine's stable cluster id: clusters numbered by size, largest 0,
# ties by lower draft conviction (engine/analytics/draft_profiles.py). Without
# this file a league gets generated labels from each cluster's most distinctive
# trait. If a refit reorders the clusters, the build's INFO line shows the new
# ids; update the keys here.
#
# Written 2026-10-01 from the page's names (page cluster ids 0-3 became engine ids
# 2, 1, 3, 0).

0:
  name: "Balanced Board-Followers"
  desc: "Largest group. Lowest conviction/reach/value-hunting/adp-independence scores of all four -- hews closest to consensus. Waits longest of any group on K, second-longest on DST."
  color: "#5a8a5a"
1:
  name: "Patient Value Hunters"
  desc: "Largest sub-50% conviction group; mild WR lean early, most negative average ADP deviation (drafts the most 'value' relative to consensus), lowest reach tendency alongside the Balanced Board-Followers."
  color: "#4a7fa8"
2:
  name: "High-Conviction Board-Breakers"
  desc: "Reaches furthest from ADP of any group, especially on RB/WR. Highest composite scores on value_hunting, draft_conviction, and adp_independence. Ignores consensus rankings and drafts by its own board."
  color: "#c9683f"
3:
  name: "Early-RB Rushers"
  desc: "Most extreme and distinctive archetype: ~73% of rounds 1-3 picks go to RB (vs ~40% elsewhere), lowest rb_wr_balance (most imbalanced), highest same-position run rate, waits longest of any group on DST."
  color: "#a85a5a"
