# Team names as the site shows them, where it differs from ESPN's name on purpose.
# Editorial: each section is keyed by season, then ESPN's team name.
#
#   shown   replaces ESPN's name on every page
#   short   the name used where a page shortens team names (the gauntlet cards on
#           extra-analytics); falls back to `shown`, then ESPN's name
#
# Without this file every page shows ESPN's names. Written 2026-10-01 from the live
# pages (extra-analytics gauntlet cards; champions.html shows the full names). Case and
# emoji differences are not listed (the build shows ESPN's spelling for those).

shown:
  2020:
    "Fourth Reich ✠": "The Minutemen"

short:
  2021:
    "I shoot blanks n shit": "I shoot b n s"
  2023:
    "San Giacomos Frannys Fanny": "San Giacomos FF"
