name: Deploy

# Milestone M1 (docs/PUBLISH_PLAN.md section 8): GitHub Pages serves the engine's build
# (engine update --verify): the committed pages, styles and images with every data file
# generated from ESPN data, plus the change report at /changes.html, and the Stage B pages
# (web/) as a preview at /next/ until they replace the root (milestone M2).
# A deploy happens only when the build, its checks and the page tests pass. Otherwise
# nothing is deployed, the last good site stays up, and the run fails so GitHub emails it.
# Runs on every push to main, from the Run workflow button, and on a schedule:
# Tuesday after Monday Night Football and Friday for ESPN's stat corrections.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # times are UTC: 9:23 am New York time in summer time, 8:23 am in winter
    - cron: "23 13 * * 2"
    - cron: "23 13 * * 5"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEAGUE: leagues/preach/league.yaml
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml pandas pyarrow scipy scikit-learn jsonschema requests playwright
          python -m playwright install --with-deps chromium

      - name: Restore the ESPN cache (finished seasons are pulled once)
        uses: actions/cache/restore@v4
        with:
          path: .cache/espn
          key: espn-raw-${{ github.run_id }}
          restore-keys: espn-raw-

      - name: engine update (pull, normalize, analyze, build --verify)
        id: update
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python -m engine.cli update "$LEAGUE" --out dist --verify

      - name: Save the ESPN cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .cache/espn
          key: espn-raw-${{ github.run_id }}

      - name: Sanity checks against the last deploy
        # the M0 preview kept its stats at /next/; the root has them from the first M1 deploy on
        run: |
          python tools/deploy_site.py sanity --dist dist \
            --previous "$SITE_URL/deploy-stats.json" --previous "$SITE_URL/next/deploy-stats.json"

      - name: Change report against the live site (published at /changes.html)
        continue-on-error: true            # release notes: a failure here never holds back the deploy
        shell: bash
        run: |
          python tools/change_report.py --dist dist --site "$SITE_URL" | tee change-report.txt
          { echo "### What changed"; echo; sed 's/^/- /' change-report.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Page test on the build
        run: |
          python tools/smoke_pages.py dist --screenshots screenshots
          python tools/smoke_pages.py dist/next --screenshots screenshots/next

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 30

      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

  site:
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml playwright
          python -m playwright install --with-deps chromium

      - name: Get the engine build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Assemble the site (the engine build, checked byte for byte)
        run: python tools/deploy_site.py assemble --out _site --dist dist

      - name: Page test on the assembled site
        run: python tools/smoke_pages.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [engine, site, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::Nothing was deployed: the live site still shows the last good build. Open the first failed job's log (expired ESPN cookies are named in the engine update step)."
          exit 1
