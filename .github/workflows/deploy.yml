name: Deploy

# GitHub Pages serves the engine's build (docs/PUBLISH_PLAN.md section 8): every league in one job,
# updated at the same time (engine update --verify, without the Stage A comparisons, which CI runs),
# then sanity checks, change reports (/changes.html), the site assembled as it will be served
# (SITE_ROOT), and one page test of it. A deploy happens only when all of that passes. Otherwise
# nothing is deployed, the last good site stays up, and the run fails so GitHub emails it.
# Python packages are restored from a cache and the page test uses the runner's Google Chrome,
# so a run spends its time on the update, not on installing (decision 7.17).
# Runs on every push to main, from the Run workflow button, and on a schedule:
# Tuesday 5 am New York time after Monday Night Football (Ethan, 2026-10-13), Tuesday
# morning again as a backup, and Friday for ESPN's stat corrections.
# Tuesday runs also start the next weekly rankings week (engine rankings start): its
# snapshot and a draft editorial file, committed to main. The draft is not on the site
# until it is published (the rankings editor or engine rankings publish). Commits made
# with the workflow's own token start no new run, so this never loops.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start_week:
        description: "Start the next rankings week (snapshot + draft) if it is not started yet"
        type: boolean
        default: false
  schedule:
    # GitHub's schedule is UTC with no daylight saving: 09:07 UTC is 5:07 am in New York in summer
    # time, 10:07 UTC in winter. The gate job runs only the one that is 5 am in New York that day.
    - cron: "7 9 * * 2"
    - cron: "7 10 * * 2"
    # backup, if ESPN had not finished Monday's week by 5 am (9:23 am summer, 8:23 am winter)
    - cron: "23 13 * * 2"
    - cron: "23 13 * * 5"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEAGUE: leagues/preach/league.yaml
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # what the root serves (engine/publish/deploy.py): web, the new site (M2), or legacy, the Stage A site
  # with the new one at /next/. Roll back by setting the repository variable SITE_ROOT to legacy
  # (Settings, Secrets and variables, Actions, Variables) and running this workflow.
  SITE_ROOT: ${{ vars.SITE_ROOT || 'web' }}
  # more leagues served beside the first, each at /PATH/ (PATH=league.yaml, space-separated; option B,
  # 2026-10-08). Each is built, checked and page-tested like the first; any failure deploys nothing.
  LEAGUES_EXTRA: "family=leagues/family/league.yaml"

jobs:
  gate:
    # which run this is: the 5 am Tuesday cron that is not 5 am today does nothing
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
      start_week: ${{ steps.gate.outputs.start_week }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          START_INPUT: ${{ inputs.start_week }}
        shell: bash
        run: |
          offset=$(TZ=America/New_York date +%z)      # -0400 summer time, -0500 winter
          run=true; start=false
          case "$EVENT:$CRON" in
            "schedule:7 9 * * 2")   [ "$offset" = "-0400" ] || run=false; start=true ;;
            "schedule:7 10 * * 2")  [ "$offset" = "-0500" ] || run=false; start=true ;;
            "schedule:23 13 * * 2") start=true ;;
            workflow_dispatch:*)    if [ "$START_INPUT" = "true" ]; then start=true; fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "start_week=$start" >> "$GITHUB_OUTPUT"
          echo "event $EVENT, schedule '$CRON', New York offset $offset: run=$run start_week=$start"

  build:
    # one job (2026-10-15, faster deploys): every league updated at once, then sanity checks, change
    # reports, the assembled site, and one page test of what will be served, pages six at a time
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write                    # the rankings week start commits its two files to main
    env:
      SMOKE_BROWSER_CHANNEL: chrome      # the runner's Google Chrome: no browser download each run
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"

      - name: Restore the Python packages
        id: pydeps
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pydeps-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', '.github/workflows/deploy.yml') }}

      - name: Install dependencies (instant when restored)
        run: pip install pyyaml pandas pyarrow scipy scikit-learn jsonschema requests playwright pillow

      - name: Browser for the page test
        run: google-chrome --version || python -m playwright install --with-deps chromium

      - name: Restore the ESPN cache (finished seasons are pulled once)
        uses: actions/cache/restore@v4
        with:
          path: .cache/espn
          key: espn-raw-${{ github.run_id }}
          restore-keys: espn-raw-

      - name: engine update, every league at once (pull, normalize, analyze, build --verify)
        id: update
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        shell: bash
        run: |
          mkdir -p logs
          # the Stage A comparisons with the legacy goldens run in CI on every pull request, not here
          python -m engine.cli update "$LEAGUE" --out dist --verify --skip-legacy-checks > logs/main.txt 2>&1 &
          jobs=("$!:main")
          for entry in $LEAGUES_EXTRA; do
            path="${entry%%=*}"; yaml="${entry#*=}"
            python -m engine.cli update "$yaml" --out "dist-$path" --verify --skip-legacy-checks > "logs/$path.txt" 2>&1 &
            jobs+=("$!:$path")
          done
          status=0
          for j in "${jobs[@]}"; do
            pid="${j%%:*}"; name="${j#*:}"
            if wait "$pid"; then result=done; else result=FAILED; status=1; fi
            echo "::group::$name: $result"; cat "logs/$name.txt"; echo "::endgroup::"
            [ "$result" = done ] || echo "::error::engine update failed for $name (open its log group above)"
          done
          exit $status

      - name: Start the next rankings week (snapshot + draft, committed to main)
        if: ${{ needs.gate.outputs.start_week == 'true' }}
        # never holds back the deploy: the draft is not on the site either way; a failure shows as a
        # warning on the run and the backup run (or the Run workflow box) tries again
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          python -m engine.cli rankings start "$LEAGUE" | tee start-week.txt
          echo "### Rankings week" >> "$GITHUB_STEP_SUMMARY"; sed 's/^/- /' start-week.txt >> "$GITHUB_STEP_SUMMARY"
          dir="$(dirname "$LEAGUE")"
          git add "$dir/snapshots/rankings" "$dir/editorial/rankings"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$(head -1 start-week.txt | sed 's/^rankings: //'): snapshot and draft (automatic)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "::warning::could not push the rankings week start to main"; exit 1

      - name: Save the ESPN cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .cache/espn
          key: espn-raw-${{ github.run_id }}

      - name: Sanity checks against the last deploy
        shell: bash
        run: |
          set -eo pipefail
          python tools/deploy_site.py sanity --dist dist --previous "$SITE_URL/deploy-stats.json"
          for entry in $LEAGUES_EXTRA; do
            path="${entry%%=*}"
            python tools/deploy_site.py sanity --dist "dist-$path" --previous "$SITE_URL/$path/deploy-stats.json"
          done

      - name: Change reports against the live site (published at /changes.html)
        continue-on-error: true            # release notes: a failure here never holds back the deploy
        shell: bash
        run: |
          python tools/change_report.py --dist dist --site "$SITE_URL" --models > change-report.txt &
          for entry in $LEAGUES_EXTRA; do
            path="${entry%%=*}"
            python tools/change_report.py --dist "dist-$path" --site "$SITE_URL/$path" --models > "change-report-$path.txt" &
          done
          wait
          { echo "### What changed"; echo; sed 's/^/- /' change-report.txt; } >> "$GITHUB_STEP_SUMMARY"
          for entry in $LEAGUES_EXTRA; do
            path="${entry%%=*}"
            { echo "### What changed at /$path/"; echo; sed 's/^/- /' "change-report-$path.txt"; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Assemble the site (SITE_ROOT; every file checked against the build)
        shell: bash
        run: |
          args=()
          for entry in $LEAGUES_EXTRA; do path="${entry%%=*}"; args+=(--league "$path=dist-$path"); done
          python tools/deploy_site.py assemble --out _site --dist dist --root "$SITE_ROOT" "${args[@]}"

      - name: Page test on the site as it will be served
        shell: bash
        run: |
          set -eo pipefail
          python tools/smoke_pages.py _site --screenshots screenshots
          if [ "$SITE_ROOT" = legacy ]; then python tools/smoke_pages.py _site/next --screenshots screenshots/next; fi
          for entry in $LEAGUES_EXTRA; do
            path="${entry%%=*}"
            python tools/smoke_pages.py "_site/$path" --screenshots "screenshots/$path"
          done

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist/
            dist-*/
          retention-days: 30

      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [build, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::Nothing was deployed: the live site still shows the last good build. Open the first failed job's log (expired ESPN cookies are named in the engine update step)."
          exit 1
