name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: JSON files parse
        run: python tools/check_json.py

      - name: Referenced data and image paths exist
        run: python tools/check_paths.py

      - name: Style rules (no em dashes)
        run: python tools/check_style.py

  engine-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pyyaml pytest pandas pyarrow scipy scikit-learn jsonschema pillow

      - name: Unit tests
        run: python -m pytest -q

      - name: League config is valid
        run: python -m engine.cli config check leagues/preach/league.yaml

      - name: No league data in the site template (web/)
        run: python tools/check_web.py

  synthetic-league:
    # the whole engine on a generated league that is not Preach (engine/testing/synthetic.py):
    # normalize, analyze and build --verify through the command line, as a new league would run them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml pandas pyarrow scipy scikit-learn jsonschema playwright pillow
          python -m playwright install --with-deps chromium

      - name: Generate the synthetic league
        run: python tools/synthetic_league.py --cache .cache-synthetic

      - name: Config, normalize, analyze, build --verify
        run: |
          python -m engine.cli config check leagues/synthetic/league.yaml
          python -m engine.cli normalize leagues/synthetic/league.yaml --cache .cache-synthetic
          python -m engine.cli analyze leagues/synthetic/league.yaml --cache .cache-synthetic
          python -m engine.cli build leagues/synthetic/league.yaml --cache .cache-synthetic --out dist-synthetic --verify

      - name: The new pages (web/, the preview at next/) open on this league
        run: python tools/smoke_pages.py dist-synthetic/next --screenshots synthetic-screenshots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-screenshots
          path: synthetic-screenshots/
          retention-days: 14

  page-smoke:
    # headless Chromium opens every page of the site and fails on JavaScript errors or a blank page
    # (tools/smoke_pages.py); screenshots are kept as a workflow artifact to compare runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open every page
        run: python tools/smoke_pages.py . --screenshots smoke-screenshots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: smoke-screenshots/
          retention-days: 14
