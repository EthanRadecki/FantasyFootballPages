<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Preach Fantasy: Schedule Release</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#f5f0e8;
    --bone-dim:#ece5d8;
    --ink:#1e1a14;
    --ink-soft:#6b5f50;
    --rep:#a8434a;
    --rep-dark:#7c2f34;
    --dem:#3f6583;
    --dem-dark:#2c495f;
    --gold:#b8892f;
    --gold-dark:#8f6a1f;
    --purple:#6b5a6c;
    --purple-soft:#9c949c;
    --line:rgba(30,26,20,0.14);
    --win:#4c8a5e;
    --loss:#b8402f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overscroll-behavior:none;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    height:100vh;
    background:var(--bone);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* HEADER */
  .topbar{
    flex:0 0 auto;
    z-index:50;
    background:var(--bone);
    padding:16px 18px 0 18px;
    border-bottom:1px solid var(--line);
  }
  .brand-title{
    font-family:'Anton', sans-serif;
    font-size:23px;
    letter-spacing:0.5px;
    line-height:1;
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-top:3px;
    margin-bottom:12px;
  }
  .manager-row{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:12px;
    scrollbar-width:none;
  }
  .manager-row::-webkit-scrollbar{display:none;}

  .view-toggle{
    display:flex; gap:6px;
    padding-bottom:12px;
  }
  .toggle-btn{
    flex:1;
    text-align:center;
    padding:8px 6px;
    border-radius:10px;
    font-size:12.5px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    color:var(--ink-soft);
    background:var(--bone-dim);
    border:1.5px solid var(--line);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .toggle-btn.active{
    background:var(--ink);
    color:var(--bone);
    border-color:var(--ink);
  }
  .chip{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    padding:5px 12px 5px 5px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--bone-dim);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.15s ease;
    font-family:'Inter',sans-serif;
  }
  .chip img{ width:20px; height:20px; border-radius:50%; object-fit:cover; background:#fff; }
  .chip.active{
    background:var(--ink);
    color:var(--bone);
    border-color:var(--ink);
  }
  .chip:active{ transform:scale(0.96); }

  /* LOGO fallback */
  .logo{
    border-radius:50%;
    object-fit:cover;
    background:var(--bone-dim);
    border:1px solid var(--line);
    flex:0 0 auto;
  }
  .logo-fallback{
    display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif;
    color:var(--ink-soft);
    background:var(--bone-dim);
    border-radius:50%;
    flex:0 0 auto;
  }

  /* PLACEHOLDER */
  .placeholder{
    padding:80px 30px;
    text-align:center;
    color:var(--ink-soft);
  }
  .placeholder-emoji{ font-family:'Anton',sans-serif; font-size:52px; color:var(--purple-soft); margin-bottom:10px;}
  .placeholder-text{ font-size:15px; line-height:1.5; }

  /* CONFERENCE BADGE */
  .conf-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; letter-spacing:0.5px;
    padding:3px 8px; border-radius:5px;
  }
  .conf-REP{ background:rgba(168,67,74,0.14); color:var(--rep-dark); }
  .conf-DEM{ background:rgba(63,101,131,0.14); color:var(--dem-dark); }

  /* SEASON SUMMARY STRIP */
  .season-strip{
    flex:0 0 auto;
    padding:12px 18px 0 18px;
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bone);
  }
  .season-name-row{ display:flex; align-items:center; gap:9px; }
  .season-name-row .logo{ width:30px; height:30px; }
  .season-name{
    font-family:'Anton',sans-serif;
    font-size:18px;
  }
  .swipe-hint{
    flex:0 0 auto;
    padding:4px 18px 8px 18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.6px;
    background:var(--bone);
  }

  /* CAROUSEL: one full card per view, no peeking */
  .carousel-wrap{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .carousel{
    flex:1;
    min-height:0;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
  }
  .carousel::-webkit-scrollbar{display:none;}

  .ticket-slide{
    flex:0 0 100%;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    padding:10px 16px 10px 16px;
    display:flex;
  }

  .ticket{
    flex:1;
    min-width:0;
    position:relative;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 22px rgba(30,26,20,0.14);
    background:#fff;
    border:1.5px solid var(--line);
    display:flex;
    flex-direction:column;
    opacity:0.4;
    transform:scale(0.86) rotate(-1deg);
    transition:opacity 0.45s cubic-bezier(0.34,1.56,0.64,1), transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }
  .ticket.active-card{ opacity:1; transform:scale(1) rotate(0deg); }

  .ticket.rivalry .ticket-body{ background:linear-gradient(180deg, rgba(168,67,74,0.06), rgba(255,255,255,0) 40%); }
  .ticket.biggame .ticket-body{ background:linear-gradient(180deg, rgba(184,137,47,0.08), rgba(255,255,255,0) 40%); }
  .ticket.inter .ticket-body{ background:linear-gradient(180deg, rgba(63,101,131,0.06), rgba(255,255,255,0) 40%); }
  .ticket.closest .ticket-body{ background:linear-gradient(180deg, rgba(63,107,94,0.07), rgba(255,255,255,0) 40%); }
  .ticket.lopsided .ticket-body{ background:linear-gradient(180deg, rgba(161,87,44,0.08), rgba(255,255,255,0) 40%); }
  .ticket-body{ background:linear-gradient(180deg, rgba(107,90,108,0.05), rgba(255,255,255,0) 40%); }

  .banner-biggame{
    background-size:200% 100%;
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ background-position:0% 0%; }
    50%{ background-position:100% 0%; }
    100%{ background-position:0% 0%; }
  }

  .logo-halo{
    padding:4px;
    border-radius:50%;
    display:flex;
  }
  .halo-REP{ background:radial-gradient(circle, rgba(168,67,74,0.22), rgba(168,67,74,0) 72%); }
  .halo-DEM{ background:radial-gradient(circle, rgba(63,101,131,0.22), rgba(63,101,131,0) 72%); }

  .ticket-banner{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 14px;
    font-family:'Anton',sans-serif;
    font-size:16px; letter-spacing:0.5px; text-transform:uppercase;
    color:#fff;
    text-align:center;
  }
  .banner-rivalry{ background:linear-gradient(100deg, var(--rep-dark), var(--rep) 60%, var(--rep-dark)); }
  .banner-biggame{ background:linear-gradient(100deg, var(--gold-dark), var(--gold) 60%, var(--gold-dark)); }
  .banner-inter{ background:linear-gradient(100deg, var(--rep-dark) 0%, var(--rep) 42%, var(--dem) 58%, var(--dem-dark) 100%); }
  .banner-standard{ background:linear-gradient(100deg, var(--purple), #7d6d7e); }
  .banner-closest{ background:linear-gradient(100deg, #3f6b5e, #5c9382 60%, #3f6b5e); }
  .banner-lopsided{ background:linear-gradient(100deg, #6b3a1f, #a1572c 60%, #6b3a1f); }

  .ticket-body{
    padding:16px 18px 18px 18px;
    flex:1;
    display:flex; flex-direction:column;
    justify-content:center;
    overflow-y:auto;
  }

  .week-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--ink-soft); letter-spacing:0.8px; text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  .inter-note{
    font-size:12px; color:var(--ink-soft); font-style:italic;
    margin:-4px 0 12px 0;
    text-align:center;
  }

  .matchup-row{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-bottom:12px;
  }
  .matchup-row .logo, .matchup-row .logo-fallback{ width:72px; height:72px; font-size:24px; }
  .matchup-vs{ font-family:'Anton',sans-serif; font-size:20px; color:var(--purple); letter-spacing:1px; }
  .matchup-names{
    display:flex; justify-content:space-between; margin-bottom:16px; gap:8px;
  }
  .matchup-name{
    font-family:'Anton',sans-serif;
    font-size:18px;
    text-align:center;
    flex:1;
    line-height:1.1;
  }

  .stat-line{
    display:flex; align-items:baseline; gap:6px;
    font-size:13px;
    color:var(--ink);
    margin-bottom:6px;
    line-height:1.4;
  }
  .stat-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.6px;
    flex:0 0 auto; padding-top:1px;
  }
  .stat-value{ font-weight:600; }

  .h2h-history{
    margin:8px 0 14px 0;
    display:flex; flex-direction:column;
    max-height:230px; overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .h2h-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 2px;
    border-bottom:1px solid var(--line);
  }
  .h2h-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px;
  }
  .h2h-score{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:700;
  }
  .h2h-score .h2h-dash{ color:var(--ink-soft); font-weight:400; margin:0 3px; }
  .h2h-empty{
    font-size:12.5px; color:var(--ink-soft); font-style:italic;
    padding:8px 2px;
  }

  .caption{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13px;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.45;
  }

  .ticket.rivalry{ border-color:rgba(124,47,52,0.45); }
  .ticket.biggame{ border-color:rgba(184,137,47,0.6); box-shadow:0 6px 26px rgba(184,137,47,0.32); }
  .ticket.inter{ border-color:rgba(63,101,131,0.4); }
  .ticket.closest{ border-color:rgba(63,107,94,0.45); }
  .ticket.lopsided{ border-color:rgba(161,87,44,0.5); }

  /* progress dots */
  .progress{
    flex:0 0 auto;
    display:flex; justify-content:center; gap:5px;
    padding:10px 0 12px 0;
    background:var(--bone);
  }
  .pdot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:all 0.2s ease; }
  .pdot.active{ background:var(--ink); width:16px; border-radius:3px; }

  /* LEAGUE-WIDE SCHEDULE VIEW */
  .league-schedule{
    flex:1; min-height:0; overflow-y:auto;
    padding:12px 18px 24px 18px;
    display:flex; flex-direction:column; gap:14px;
  }
  .league-week-card{
    border-radius:16px;
    overflow:hidden;
    border:1.5px solid var(--line);
    background:#fff;
    box-shadow:0 3px 12px rgba(30,26,20,0.08);
    flex-shrink:0;
  }
  .league-week-card.rivalry{ background:linear-gradient(160deg, rgba(168,67,74,0.10), #fff 55%); border-color:rgba(124,47,52,0.35); }
  .league-week-card.biggame{ background:linear-gradient(160deg, rgba(184,137,47,0.13), #fff 55%); border-color:rgba(184,137,47,0.5); }
  .league-week-card.inter{ background:linear-gradient(160deg, rgba(63,101,131,0.10), #fff 55%); border-color:rgba(63,101,131,0.35); }
  .league-week-card.closest{ background:linear-gradient(160deg, rgba(63,107,94,0.10), #fff 55%); border-color:rgba(63,107,94,0.4); }
  .league-week-card.lopsided{ background:linear-gradient(160deg, rgba(161,87,44,0.12), #fff 55%); border-color:rgba(161,87,44,0.45); }
  .league-week-card.standard{ background:linear-gradient(160deg, rgba(107,90,108,0.07), #fff 55%); }
  .league-week-banner{
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:9px 12px;
    font-family:'Anton',sans-serif;
    font-size:13px; letter-spacing:0.4px; text-transform:uppercase;
    color:#fff; text-align:center;
  }
  .league-matchup-list{
    padding:10px 14px 12px 14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .league-matchup-row{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px;
    flex-shrink:0;
  }
  .league-matchup-row .logo, .league-matchup-row .logo-fallback{ width:22px; height:22px; font-size:9px; }
  .league-matchup-name{ flex:1; font-weight:600; }
  .league-vs{
    color:var(--ink-soft); font-size:9.5px;
    font-family:'IBM Plex Mono',monospace;
  }
  .league-cross-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:8px; font-weight:700; color:var(--ink-soft);
    background:var(--bone-dim); padding:2px 5px; border-radius:4px;
  }

  /* GRID / CALENDAR VIEW */
  .grid-wrap{
    flex:1; min-height:0;
    overflow:auto;
    padding:10px 0 16px 0;
  }
  .schedule-grid{
    border-collapse:separate;
    border-spacing:0;
    font-family:'Inter',sans-serif;
  }
  .grid-corner{
    position:sticky; top:0; left:0; z-index:5;
    background:var(--bone);
    min-width:88px;
  }
  .grid-week-header{
    position:sticky; top:0; z-index:3;
    min-width:46px;
    max-width:46px;
    padding:6px 3px;
    text-align:center;
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
  }
  .grid-week-num{ font-size:12px; font-weight:700; }
  .grid-week-theme{ font-size:8px; line-height:1.2; margin-top:2px; opacity:0.9; }
  .grid-team-header{
    position:sticky; left:0; z-index:2;
    background:var(--bone);
    padding:6px 10px;
    text-align:left;
    white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  .grid-team-header-inner{ display:flex; align-items:center; gap:6px; }
  .grid-team-header .logo, .grid-team-header .logo-fallback{ width:20px; height:20px; font-size:8px; }
  .grid-team-name{ font-size:11px; font-weight:700; }
  .grid-cell{
    text-align:center;
    padding:4px;
    border-bottom:1px solid rgba(30,26,20,0.06);
    border-right:1px solid rgba(30,26,20,0.06);
  }
  .grid-cell .logo, .grid-cell .logo-fallback{ width:26px; height:26px; font-size:9px; margin:0 auto; }
  .grid-cell.conf-cell-REP{ background:rgba(168,67,74,0.16); }
  .grid-cell.conf-cell-DEM{ background:rgba(63,101,131,0.16); }

  .theme-header-rivalry{ background:linear-gradient(180deg, var(--rep-dark), var(--rep)); }
  .theme-header-biggame{ background:linear-gradient(180deg, var(--gold-dark), var(--gold)); }
  .theme-header-inter{ background:linear-gradient(180deg, var(--rep), var(--dem)); }
  .theme-header-closest{ background:linear-gradient(180deg, #3f6b5e, #5c9382); }
  .theme-header-lopsided{ background:linear-gradient(180deg, #6b3a1f, #a1572c); }
  .theme-header-standard{ background:linear-gradient(180deg, var(--purple), #7d6d7e); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-title">SCHEDULE RELEASE</div>
    <div class="brand-sub">Preach Fantasy &middot; Season 2026</div>
    <div class="manager-row" id="managerRow"></div>
    <div class="view-toggle" id="viewToggle">
      <div class="toggle-btn active" data-view="my">My Schedule</div>
      <div class="toggle-btn" data-view="league">Full Schedule</div>
      <div class="toggle-btn" data-view="grid">Grid</div>
    </div>
  </div>

  <div id="content" class="carousel-wrap"></div>
</div>

<script>
const DATA_URL = '../data/manager_schedule.json';
const LEAGUE_DATA_URL = '../data/schedule_by_week.json';
const LOGO_PATH = (name) => '../images/logos/' + name.trim().split(' ').slice(-1)[0] + '.png';

const CONF = {
  'Ethan Radecki':'DEM','Andrew Root':'DEM','Max Malich':'DEM','Deniz Bileydi':'DEM',
  'Baylen Slansky':'DEM','Cole Maney':'DEM','Aidan Quigley':'DEM',
  'Anthony Kelly':'REP','Ben Castaldo':'REP','Brandon Hancock':'REP','Carmine Pittelli':'REP',
  'Charlie Gorman':'REP','Quin Gegwich':'REP','Ryan McQuaid':'REP'
};

let MANAGERS_DATA = {};
let MANAGERS = [];
let LEAGUE_SCHEDULE = [];
let CURRENT_VIEW = 'my';
let CURRENT_MANAGER = null;

const THEME_CLASS = {
  'Rivalry Week':'rivalry','Big Game Week':'biggame','Interconference Week':'inter',
  'Closest Rivalries Week':'closest','Lopsided History Week':'lopsided'
};
const THEME_BANNER_CLASS = {
  'Rivalry Week':'banner-rivalry','Big Game Week':'banner-biggame','Interconference Week':'banner-inter',
  'Closest Rivalries Week':'banner-closest','Lopsided History Week':'banner-lopsided'
};
const THEME_ICON = {
  'Rivalry Week':'&#9876;&#65039;','Big Game Week':'&#127942;','Interconference Week':'&#127775;',
  'Closest Rivalries Week':'&#9878;&#65039;','Lopsided History Week':'&#128293;'
};

function hexToRgb(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `${r},${g},${b}`;
}

const MANAGER_COLOR = {
  'Carmine Pittelli': hexToRgb('#541821'),
  'Anthony Kelly': hexToRgb('#cdbca6'),
  'Charlie Gorman': hexToRgb('#9f8bc2'),
  'Cole Maney': hexToRgb('#f7cdb9'),
  'Ethan Radecki': hexToRgb('#ea9a2e'),
  'Deniz Bileydi': hexToRgb('#8d9b51'),
  'Baylen Slansky': hexToRgb('#776aad'),
  'Andrew Root': hexToRgb('#4c82af'),
  'Max Malich': hexToRgb('#888888'),
  'Ben Castaldo': hexToRgb('#404c5b'),
  'Brandon Hancock': hexToRgb('#4875b9'),
  'Aidan Quigley': hexToRgb('#eb644c'),
  'Quin Gegwich': hexToRgb('#ad1f15'),
  'Ryan McQuaid': hexToRgb('#dfc983')
};

function initials(name){ return name.split(' ').map(p=>p[0]).join(''); }

function logoImg(name, size){
  return `<img class="logo" src="${LOGO_PATH(name)}" style="width:${size}px;height:${size}px"
    onerror="this.outerHTML='<div class=&quot;logo-fallback&quot; style=&quot;width:${size}px;height:${size}px&quot;>${initials(name)}</div>'">`;
}

function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 1000; }
  return h;
}

function seasonLabel(g){
  if(g.week.startsWith('Playoff')) return g.season+' playoffs';
  return "'"+g.season.slice(2)+' '+g.week.replace('Week ','Wk ');
}
function h2hLabel(g){
  const yr = "'"+String(g.season).slice(2);
  return g.label.startsWith('Week') ? yr+' '+g.label.replace('Week ','Wk ') : yr+' '+g.label;
}
function fmtScore(n){ return n.toFixed(1); }

function generateCaption(entry, meName){
  const {my_wins, opp_wins, total_games, closest, blowout} = entry;
  const opp = entry.opponent;
  const h = hashStr(meName+opp+entry.week);

  if(total_games===0){
    const opts = [
      "No history here. First-ever meeting, clean slate.",
      "Uncharted territory. These two have never lined up before.",
      "Brand new beef. Nothing on the scoreboard yet."
    ];
    return opts[h%opts.length];
  }

  const diff = my_wins - opp_wins;
  let base;
  if(Math.abs(diff) <= 1 && total_games>=4){
    const opts = [
      `Dead even at ${my_wins}-${opp_wins}. About as balanced as this league gets.`,
      `Razor-thin all-time, ${my_wins}-${opp_wins}. Anyone's series.`,
      `${my_wins}-${opp_wins} all-time, a genuine coin flip.`
    ];
    base = opts[h%opts.length];
  } else if(diff >= 4 || (total_games>=5 && my_wins/total_games>=0.72)){
    const opts = [
      `You've owned this one, ${my_wins}-${opp_wins} all-time.`,
      `Total domination so far: ${my_wins}-${opp_wins} in your favor.`,
      `${my_wins}-${opp_wins}. This series isn't close.`
    ];
    base = opts[h%opts.length];
  } else if(diff <= -4 || (total_games>=5 && opp_wins/total_games>=0.72)){
    const opts = [
      `They've had your number: ${opp_wins}-${my_wins} all-time.`,
      `Not your series, ${opp} leads ${opp_wins}-${my_wins}.`,
      `${opp_wins}-${my_wins} in their favor. Time for a correction?`
    ];
    base = opts[h%opts.length];
  } else {
    const leaderMe = diff>0;
    const opts = leaderMe ? [
      `You're up ${my_wins}-${opp_wins}, but it's not settled.`,
      `Slight edge for you, ${my_wins}-${opp_wins} all-time.`
    ] : [
      `${opp} holds a ${opp_wins}-${my_wins} edge, for now.`,
      `They're up ${opp_wins}-${my_wins} all-time. Room to close the gap.`
    ];
    base = opts[h%opts.length];
  }

  let extra = '';
  if(closest && closest.margin < 4){
    extra = ` Their closest game ever came down to ${closest.margin} points, ${closest.winner} won it, in ${seasonLabel(closest)}.`;
  } else if(blowout && blowout.margin > 70){
    extra = ` Also home to the ugliest blowout between them: ${blowout.margin} points (${seasonLabel(blowout)}).`;
  }
  return base + extra;
}

function bannerFor(entry){
  const wt = entry.week_type;
  if(wt==='Rivalry Week') return {html:`<div class="ticket-banner banner-rivalry">&#9876;&#65039; Rivalry Week</div>`};
  if(wt==='Big Game Week'){
    const label = entry.rematch ? `${entry.rematch.season} ${entry.rematch.round} Rematch` : 'Big Game Week';
    return {html:`<div class="ticket-banner banner-biggame">&#127942; ${label}</div>`};
  }
  if(wt==='Interconference Week') return {html:`<div class="ticket-banner banner-inter">&#127775; Interconference Week</div>`};
  if(wt==='Closest Rivalries Week') return {html:`<div class="ticket-banner banner-closest">&#9878;&#65039; Closest Rivalries Week</div>`};
  if(wt==='Lopsided History Week') return {html:`<div class="ticket-banner banner-lopsided">&#128293; Lopsided History Week</div>`};
  return {html:`<div class="ticket-banner banner-standard">Week ${entry.week}</div>`};
}

const THEME_HEADER_CLASS = {
  'Rivalry Week':'theme-header-rivalry','Big Game Week':'theme-header-biggame','Interconference Week':'theme-header-inter',
  'Closest Rivalries Week':'theme-header-closest','Lopsided History Week':'theme-header-lopsided'
};
const THEME_SHORT_LABEL = {
  'Rivalry Week':'RIVAL','Big Game Week':'BIG GAME','Interconference Week':'X-CONF',
  'Closest Rivalries Week':'CLOSEST','Lopsided History Week':'LOPSIDED'
};

function renderGridSchedule(){
  const content = document.getElementById('content');
  content.className = 'carousel-wrap';

  const oppByTeamWeek = {};
  MANAGERS.forEach(m=> oppByTeamWeek[m] = {});
  LEAGUE_SCHEDULE.forEach(wk=>{
    wk.matchups.forEach(m=>{
      oppByTeamWeek[m.team_a][wk.week] = m.team_b;
      oppByTeamWeek[m.team_b][wk.week] = m.team_a;
    });
  });

  let html = `<div class="grid-wrap"><table class="schedule-grid"><thead><tr>
    <th class="grid-corner"></th>`;
  LEAGUE_SCHEDULE.forEach(wk=>{
    const headerClass = THEME_HEADER_CLASS[wk.week_type] || 'theme-header-standard';
    const shortLabel = THEME_SHORT_LABEL[wk.week_type] || '';
    html += `<th class="grid-week-header ${headerClass}">
      <div class="grid-week-num">W${wk.week}</div>
      ${shortLabel ? `<div class="grid-week-theme">${shortLabel}</div>` : ''}
    </th>`;
  });
  html += `</tr></thead><tbody>`;

  MANAGERS.forEach(team=>{
    html += `<tr>
      <td class="grid-team-header">
        <div class="grid-team-header-inner">${logoImg(team, 20)}<span class="grid-team-name">${team.split(' ')[0]} ${team.split(' ')[1][0]}.</span></div>
      </td>`;
    LEAGUE_SCHEDULE.forEach(wk=>{
      const opp = oppByTeamWeek[team][wk.week];
      const oppConf = CONF[opp];
      html += `<td class="grid-cell conf-cell-${oppConf}">${logoImg(opp, 26)}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  content.innerHTML = html;
}

function renderLeagueSchedule(){
  const content = document.getElementById('content');
  content.className = 'carousel-wrap';
  let html = `<div class="league-schedule">`;
  LEAGUE_SCHEDULE.forEach(wk=>{
    const bannerClass = THEME_BANNER_CLASS[wk.week_type] || 'banner-standard';
    const themeClass = THEME_CLASS[wk.week_type] || 'standard';
    const icon = THEME_ICON[wk.week_type] || '';
    const label = wk.week_type==='Standard' ? `Week ${wk.week}` : `${icon} ${wk.week_type}`;
    html += `<div class="league-week-card ${themeClass}">
      <div class="league-week-banner ${bannerClass}">${label}${wk.week_type!=='Standard' ? ' &middot; Week '+wk.week : ''}</div>
      <div class="league-matchup-list">`;
    wk.matchups.forEach(m=>{
      html += `<div class="league-matchup-row">
        ${logoImg(m.team_a, 22)}
        <span class="league-matchup-name">${m.team_a}</span>
        <span class="league-vs">VS</span>
        <span class="league-matchup-name" style="text-align:right">${m.team_b}</span>
        ${logoImg(m.team_b, 22)}
        ${m.interconference ? `<span class="league-cross-tag">X-CONF</span>` : ''}
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

function setView(view){
  CURRENT_VIEW = view;
  document.querySelectorAll('.toggle-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  const managerRow = document.getElementById('managerRow');
  if(view==='league'){
    managerRow.style.display = 'none';
    renderLeagueSchedule();
  } else if(view==='grid'){
    managerRow.style.display = 'none';
    renderGridSchedule();
  } else {
    managerRow.style.display = 'flex';
    if(CURRENT_MANAGER){
      selectManager(CURRENT_MANAGER);
    } else {
      document.getElementById('content').className = 'carousel-wrap';
      document.getElementById('content').innerHTML = `
        <div class="placeholder">
          <div class="placeholder-emoji">2026</div>
          <div class="placeholder-text">Tap your name up top to pull up your full schedule, rivalry history, and the games with real history behind them.</div>
        </div>`;
    }
  }
}

function renderManagerChips(selected){
  const row = document.getElementById('managerRow');
  row.innerHTML = '';
  MANAGERS.forEach(m=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (m===selected ? ' active' : '');
    chip.innerHTML = logoImg(m, 20) + '<span>' + m.split(' ')[0] + '</span>';
    chip.onclick = ()=> selectManager(m);
    row.appendChild(chip);
  });
}

function renderTicket(entry, meName){
  const themeClassMap = {
    'Rivalry Week':'rivalry','Big Game Week':'biggame','Interconference Week':'inter',
    'Closest Rivalries Week':'closest','Lopsided History Week':'lopsided'
  };
  const tClass = themeClassMap[entry.week_type] || '';
  const oppConf = CONF[entry.opponent];

  const dots = entry.game_log.map(r => `<div class="rdot ${r==='win'?'win':'loss'}"></div>`).join('');

  const record = entry.total_games===0
    ? 'First meeting'
    : `<span style="color:var(--win)">${entry.my_wins}</span>-<span style="color:var(--loss)">${entry.opp_wins}</span> <span style="color:var(--ink-soft); font-weight:500;">all-time</span>`;

  const h2hHistory = (entry.games && entry.games.length)
    ? `<div class="h2h-history">${entry.games.map(g => {
        const iWon = g.winner === meName;
        return `<div class="h2h-row">
          <div class="h2h-label">${h2hLabel(g)}</div>
          <div class="h2h-score">
            <span style="color:${iWon?'var(--win)':'var(--loss)'}">${fmtScore(g.score_a)}</span><span class="h2h-dash">-</span><span style="color:${iWon?'var(--loss)':'var(--win)'}">${fmtScore(g.score_b)}</span>
          </div>
        </div>`;
      }).join('')}</div>`
    : `<div class="h2h-empty">First meeting -- no history yet.</div>`;

  const caption = generateCaption(entry, meName);
  const interNote = entry.week_type==='Interconference Week'
    ? `<div class="inter-note">Every matchup across the league this week is REP vs. DEM.</div>` : '';
  const bigGameNote = entry.week_type==='Big Game Week'
    ? `<div class="inter-note">This week across the league is Big Game Week: championship and playoff rematches from throughout league history.</div>` : '';
  const closestNote = entry.week_type==='Closest Rivalries Week'
    ? `<div class="inter-note">Every matchup across the league this week is a dead-even, all-time series.</div>` : '';
  const lopsidedNote = entry.week_type==='Lopsided History Week'
    ? `<div class="inter-note">Every matchup across the league this week is the most one-sided series either manager has.</div>` : '';
  const banner = bannerFor(entry);
  const colorA = MANAGER_COLOR[meName] || '107,90,108';
  const colorB = MANAGER_COLOR[entry.opponent] || '107,90,108';
  const ticketBg = `background:linear-gradient(150deg, rgba(${colorA},0.22), rgba(${colorB},0.22) 60%, #fff 100%);`;

  return `
  <div class="ticket-slide">
    <div class="ticket ${tClass}" style="${ticketBg}">
      ${banner.html}
      <div class="ticket-body">
        <div class="week-tag">Week ${entry.week}</div>
        ${interNote}
        ${bigGameNote}
        ${closestNote}
        ${lopsidedNote}
        <div class="matchup-row">
          <div class="logo-halo halo-${CONF[meName]}">${logoImg(meName, 72)}</div>
          <div class="matchup-vs">VS</div>
          <div class="logo-halo halo-${oppConf}">${logoImg(entry.opponent, 72)}</div>
        </div>
        <div class="matchup-names">
          <div class="matchup-name">${meName}</div>
          <div class="matchup-name">${entry.opponent}</div>
        </div>
        <div class="stat-line"><span class="stat-label">Series</span><span class="stat-value">${record}</span>
          <span class="conf-badge conf-${oppConf}" style="margin-left:auto">${oppConf}</span></div>
        ${h2hHistory}
      </div>
    </div>
  </div>`;
}

function selectManager(name){
  CURRENT_MANAGER = name;
  renderManagerChips(name);
  const content = document.getElementById('content');
  content.className = 'carousel-wrap';
  const schedule = MANAGERS_DATA[name];

  let html = `
    <div class="season-strip">
      <div class="season-name-row">
        ${logoImg(name, 30)}
        <div class="season-name">${name}</div>
      </div>
      <span class="conf-badge conf-${CONF[name]}">${CONF[name]}</span>
    </div>
    <div class="swipe-hint">Swipe to move through the season &rarr;</div>
    <div class="carousel" id="carousel">`;

  schedule.forEach(entry=>{ html += renderTicket(entry, name); });
  html += `</div><div class="progress" id="progress"></div>`;
  content.innerHTML = html;

  const progress = document.getElementById('progress');
  schedule.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'pdot' + (i===0 ? ' active' : '');
    progress.appendChild(d);
  });

  const carousel = document.getElementById('carousel');
  const slides = carousel.querySelectorAll('.ticket-slide');
  const tickets = carousel.querySelectorAll('.ticket');
  const dots = progress.querySelectorAll('.pdot');
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      const idx = Array.from(slides).indexOf(e.target);
      const ticketEl = tickets[idx];
      if(e.isIntersecting && e.intersectionRatio > 0.6){
        ticketEl.classList.add('active-card');
        dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
      } else {
        ticketEl.classList.remove('active-card');
      }
    });
  }, {root: carousel, threshold:[0.6]});
  slides.forEach(s=>observer.observe(s));
}

Promise.all([
  fetch(DATA_URL).then(r=>r.json()),
  fetch(LEAGUE_DATA_URL).then(r=>r.json())
]).then(([managerData, leagueData])=>{
  MANAGERS_DATA = managerData;
  LEAGUE_SCHEDULE = leagueData;
  MANAGERS = Object.keys(managerData).sort((a,b)=> a.split(' ')[0].localeCompare(b.split(' ')[0]));
  renderManagerChips(null);
  document.getElementById('content').innerHTML = `
    <div class="placeholder">
      <div class="placeholder-emoji">2026</div>
      <div class="placeholder-text">Tap your name up top to pull up your full schedule, rivalry history, and the games with real history behind them.</div>
    </div>`;
  document.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.onclick = ()=> setView(btn.dataset.view);
  });
}).catch(err=>{
  document.getElementById('content').innerHTML = `<div class="placeholder"><div class="placeholder-text">Couldn't load schedule data. Check the data folder path.</div></div>`;
});
</script>
