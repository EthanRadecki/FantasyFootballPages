<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Preach Fantasy: Schedule Release</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#f5f0e8;
    --bone-dim:#ece5d8;
    --ink:#1e1a14;
    --ink-soft:#6b5f50;
    --rep:#a8434a;
    --rep-dark:#7c2f34;
    --dem:#3f6583;
    --dem-dark:#2c495f;
    --gold:#b8892f;
    --gold-dark:#8f6a1f;
    --purple:#6b5a6c;
    --purple-soft:#9c949c;
    --line:rgba(30,26,20,0.14);
    --win:#4c8a5e;
    --loss:#b8402f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overscroll-behavior:none;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    height:100vh;
    background:var(--bone);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* HEADER */
  .topbar{
    flex:0 0 auto;
    z-index:50;
    background:var(--bone);
    padding:16px 18px 0 18px;
    border-bottom:1px solid var(--line);
  }
  .brand-title{
    font-family:'Anton', sans-serif;
    font-size:23px;
    letter-spacing:0.5px;
    line-height:1;
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-top:3px;
    margin-bottom:12px;
  }
  .manager-row{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:12px;
    scrollbar-width:none;
  }
  .manager-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    padding:5px 12px 5px 5px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--bone-dim);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.15s ease;
    font-family:'Inter',sans-serif;
  }
  .chip img{ width:20px; height:20px; border-radius:50%; object-fit:cover; background:#fff; }
  .chip.active{
    background:var(--ink);
    color:var(--bone);
    border-color:var(--ink);
  }
  .chip:active{ transform:scale(0.96); }

  /* LOGO fallback */
  .logo{
    border-radius:50%;
    object-fit:cover;
    background:var(--bone-dim);
    border:1px solid var(--line);
    flex:0 0 auto;
  }
  .logo-fallback{
    display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif;
    color:var(--ink-soft);
    background:var(--bone-dim);
    border-radius:50%;
    flex:0 0 auto;
  }

  /* PLACEHOLDER */
  .placeholder{
    padding:80px 30px;
    text-align:center;
    color:var(--ink-soft);
  }
  .placeholder-emoji{ font-family:'Anton',sans-serif; font-size:52px; color:var(--purple-soft); margin-bottom:10px;}
  .placeholder-text{ font-size:15px; line-height:1.5; }

  /* CONFERENCE BADGE */
  .conf-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; letter-spacing:0.5px;
    padding:3px 8px; border-radius:5px;
  }
  .conf-REP{ background:rgba(168,67,74,0.14); color:var(--rep-dark); }
  .conf-DEM{ background:rgba(63,101,131,0.14); color:var(--dem-dark); }

  /* SEASON SUMMARY STRIP */
  .season-strip{
    flex:0 0 auto;
    padding:12px 18px 0 18px;
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bone);
  }
  .season-name-row{ display:flex; align-items:center; gap:9px; }
  .season-name-row .logo{ width:30px; height:30px; }
  .season-name{
    font-family:'Anton',sans-serif;
    font-size:18px;
  }
  .swipe-hint{
    flex:0 0 auto;
    padding:4px 18px 8px 18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.6px;
    background:var(--bone);
  }

  /* CAROUSEL: one full card per view, no peeking */
  .carousel-wrap{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .carousel{
    flex:1;
    min-height:0;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
  }
  .carousel::-webkit-scrollbar{display:none;}

  .ticket-slide{
    flex:0 0 100%;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    padding:10px 16px 10px 16px;
    display:flex;
  }

  .ticket{
    flex:1;
    min-width:0;
    position:relative;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 22px rgba(30,26,20,0.14);
    background:#fff;
    border:1.5px solid var(--line);
    display:flex;
    flex-direction:column;
    opacity:0.4;
    transform:scale(0.86) rotate(-1deg);
    transition:opacity 0.45s cubic-bezier(0.34,1.56,0.64,1), transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }
  .ticket.active-card{ opacity:1; transform:scale(1) rotate(0deg); }

  .ticket.rivalry .ticket-body{ background:linear-gradient(180deg, rgba(168,67,74,0.10), rgba(255,255,255,0) 45%); }
  .ticket.biggame .ticket-body{ background:linear-gradient(180deg, rgba(184,137,47,0.14), rgba(255,255,255,0) 45%); }
  .ticket.inter .ticket-body{ background:linear-gradient(180deg, rgba(63,101,131,0.10), rgba(255,255,255,0) 45%); }
  .ticket-body{ background:linear-gradient(180deg, rgba(107,90,108,0.08), rgba(255,255,255,0) 45%); }

  .banner-biggame{
    background-size:200% 100%;
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ background-position:0% 0%; }
    50%{ background-position:100% 0%; }
    100%{ background-position:0% 0%; }
  }

  .logo-halo{
    padding:4px;
    border-radius:50%;
    display:flex;
  }
  .halo-REP{ background:radial-gradient(circle, rgba(168,67,74,0.22), rgba(168,67,74,0) 72%); }
  .halo-DEM{ background:radial-gradient(circle, rgba(63,101,131,0.22), rgba(63,101,131,0) 72%); }

  .ticket-banner{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 14px;
    font-family:'Anton',sans-serif;
    font-size:16px; letter-spacing:0.5px; text-transform:uppercase;
    color:#fff;
    text-align:center;
  }
  .banner-rivalry{ background:linear-gradient(100deg, var(--rep-dark), var(--rep) 60%, var(--rep-dark)); }
  .banner-biggame{ background:linear-gradient(100deg, var(--gold-dark), var(--gold) 60%, var(--gold-dark)); }
  .banner-inter{ background:linear-gradient(100deg, var(--rep-dark) 0%, var(--rep) 42%, var(--dem) 58%, var(--dem-dark) 100%); }
  .banner-standard{ background:linear-gradient(100deg, var(--purple), #7d6d7e); }

  .ticket-body{
    padding:16px 18px 18px 18px;
    flex:1;
    display:flex; flex-direction:column;
    overflow-y:auto;
  }

  .week-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--ink-soft); letter-spacing:0.8px; text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  .inter-note{
    font-size:12px; color:var(--ink-soft); font-style:italic;
    margin:-4px 0 12px 0;
    text-align:center;
  }

  .matchup-row{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-bottom:12px;
  }
  .matchup-row .logo, .matchup-row .logo-fallback{ width:72px; height:72px; font-size:24px; }
  .matchup-vs{ font-family:'Anton',sans-serif; font-size:20px; color:var(--purple); letter-spacing:1px; }
  .matchup-names{
    display:flex; justify-content:space-between; margin-bottom:16px; gap:8px;
  }
  .matchup-name{
    font-family:'Anton',sans-serif;
    font-size:18px;
    text-align:center;
    flex:1;
    line-height:1.1;
  }

  .stat-line{
    display:flex; align-items:baseline; gap:6px;
    font-size:13px;
    color:var(--ink);
    margin-bottom:6px;
    line-height:1.4;
  }
  .stat-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.6px;
    flex:0 0 auto; padding-top:1px;
  }
  .stat-value{ font-weight:600; }

  .dot-legend{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:10px;
    margin:6px 0 6px 0;
  }
  .dot-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .legend-swatch{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  .record-track{
    display:flex; gap:3px; margin:2px 0 12px 0; flex-wrap:wrap;
  }
  .rdot{ width:10px; height:10px; border-radius:2px; }
  .rdot.win{ background:var(--win); }
  .rdot.loss{ background:var(--loss); }

  .caption{
    margin-top:auto;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13px;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.45;
  }

  .ticket.rivalry{ border-color:rgba(124,47,52,0.45); }
  .ticket.biggame{ border-color:rgba(184,137,47,0.6); box-shadow:0 6px 26px rgba(184,137,47,0.32); }
  .ticket.inter{ border-color:rgba(63,101,131,0.4); }

  /* progress dots */
  .progress{
    flex:0 0 auto;
    display:flex; justify-content:center; gap:5px;
    padding:10px 0 12px 0;
    background:var(--bone);
  }
  .pdot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:all 0.2s ease; }
  .pdot.active{ background:var(--ink); width:16px; border-radius:3px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-title">SCHEDULE RELEASE</div>
    <div class="brand-sub">Preach Fantasy &middot; Season 2026</div>
    <div class="manager-row" id="managerRow"></div>
  </div>

  <div id="content" class="carousel-wrap"></div>
</div>

<script>
const DATA_URL = '../data/manager_schedule.json';
const LOGO_PATH = (name) => '../images/logos/' + name.trim().split(' ').slice(-1)[0] + '.png';

const CONF = {
  'Ethan Radecki':'REP','Andrew Root':'REP','Max Malich':'REP','Deniz Bileydi':'REP',
  'Baylen Slansky':'REP','Cole Maney':'REP','Aidan Quigley':'REP',
  'Anthony Kelly':'DEM','Ben Castaldo':'DEM','Brandon Hancock':'DEM','Carmine Pittelli':'DEM',
  'Charlie Gorman':'DEM','Quin Gegwich':'DEM','Ryan McQuaid':'DEM'
};

let MANAGERS_DATA = {};
let MANAGERS = [];

function initials(name){ return name.split(' ').map(p=>p[0]).join(''); }

function logoImg(name, size){
  return `<img class="logo" src="${LOGO_PATH(name)}" style="width:${size}px;height:${size}px"
    onerror="this.outerHTML='<div class=&quot;logo-fallback&quot; style=&quot;width:${size}px;height:${size}px&quot;>${initials(name)}</div>'">`;
}

function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 1000; }
  return h;
}

function seasonLabel(g){
  if(g.week.startsWith('Playoff')) return g.season+' playoffs';
  return "'"+g.season.slice(2)+' '+g.week.replace('Week ','Wk ');
}
function fmtScore(n){ return n.toFixed(1); }

function generateCaption(entry, meName){
  const {my_wins, opp_wins, total_games, closest, blowout} = entry;
  const opp = entry.opponent;
  const h = hashStr(meName+opp+entry.week);

  if(total_games===0){
    const opts = [
      "No history here. First-ever meeting, clean slate.",
      "Uncharted territory. These two have never lined up before.",
      "Brand new beef. Nothing on the scoreboard yet."
    ];
    return opts[h%opts.length];
  }

  const diff = my_wins - opp_wins;
  let base;
  if(Math.abs(diff) <= 1 && total_games>=4){
    const opts = [
      `Dead even at ${my_wins}-${opp_wins}. About as balanced as this league gets.`,
      `Razor-thin all-time, ${my_wins}-${opp_wins}. Anyone's series.`,
      `${my_wins}-${opp_wins} all-time, a genuine coin flip.`
    ];
    base = opts[h%opts.length];
  } else if(diff >= 4 || (total_games>=5 && my_wins/total_games>=0.72)){
    const opts = [
      `You've owned this one, ${my_wins}-${opp_wins} all-time.`,
      `Total domination so far: ${my_wins}-${opp_wins} in your favor.`,
      `${my_wins}-${opp_wins}. This series isn't close.`
    ];
    base = opts[h%opts.length];
  } else if(diff <= -4 || (total_games>=5 && opp_wins/total_games>=0.72)){
    const opts = [
      `They've had your number: ${opp_wins}-${my_wins} all-time.`,
      `Not your series, ${opp} leads ${opp_wins}-${my_wins}.`,
      `${opp_wins}-${my_wins} in their favor. Time for a correction?`
    ];
    base = opts[h%opts.length];
  } else {
    const leaderMe = diff>0;
    const opts = leaderMe ? [
      `You're up ${my_wins}-${opp_wins}, but it's not settled.`,
      `Slight edge for you, ${my_wins}-${opp_wins} all-time.`
    ] : [
      `${opp} holds a ${opp_wins}-${my_wins} edge, for now.`,
      `They're up ${opp_wins}-${my_wins} all-time. Room to close the gap.`
    ];
    base = opts[h%opts.length];
  }

  let extra = '';
  if(closest && closest.margin < 4){
    extra = ` Their closest game ever came down to ${closest.margin} points, ${closest.winner} won it, in ${seasonLabel(closest)}.`;
  } else if(blowout && blowout.margin > 70){
    extra = ` Also home to the ugliest blowout between them: ${blowout.margin} points (${seasonLabel(blowout)}).`;
  }
  return base + extra;
}

function bannerFor(entry){
  const wt = entry.week_type;
  if(wt==='Rivalry Week') return {html:`<div class="ticket-banner banner-rivalry">&#9876;&#65039; Rivalry Week</div>`};
  if(wt==='Big Game Week'){
    const label = entry.rematch ? `${entry.rematch.season} ${entry.rematch.round} Rematch` : 'Big Game Week';
    return {html:`<div class="ticket-banner banner-biggame">&#127942; ${label}</div>`};
  }
  if(wt==='Interconference Week') return {html:`<div class="ticket-banner banner-inter">&#127775; Interconference Week</div>`};
  return {html:`<div class="ticket-banner banner-standard">Week ${entry.week}</div>`};
}

function renderManagerChips(selected){
  const row = document.getElementById('managerRow');
  row.innerHTML = '';
  MANAGERS.forEach(m=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (m===selected ? ' active' : '');
    chip.innerHTML = logoImg(m, 20) + '<span>' + m.split(' ')[0] + '</span>';
    chip.onclick = ()=> selectManager(m);
    row.appendChild(chip);
  });
}

function renderTicket(entry, meName){
  const tClass = entry.week_type==='Rivalry Week' ? 'rivalry' : entry.week_type==='Big Game Week' ? 'biggame' : entry.week_type==='Interconference Week' ? 'inter' : '';
  const oppConf = CONF[entry.opponent];

  const dots = entry.game_log.map(r => `<div class="rdot ${r==='win'?'win':'loss'}"></div>`).join('');

  const record = entry.total_games===0
    ? 'First meeting'
    : `<span style="color:var(--win)">${entry.my_wins}</span>-<span style="color:var(--loss)">${entry.opp_wins}</span> <span style="color:var(--ink-soft); font-weight:500;">all-time</span>`;

  const mostRecentHtml = entry.most_recent
    ? `<b>${fmtScore(entry.most_recent.score_a)}</b> - ${fmtScore(entry.most_recent.score_b)} <span style="color:var(--ink-soft)">(${seasonLabel(entry.most_recent)})</span>`
    : null;
  const closestHtml = entry.closest
    ? `${entry.closest.winner} won by ${entry.closest.margin} pts <span style="color:var(--ink-soft)">(${seasonLabel(entry.closest)})</span>`
    : null;

  const caption = generateCaption(entry, meName);
  const interNote = entry.week_type==='Interconference Week'
    ? `<div class="inter-note">Every matchup across the league this week is REP vs. DEM.</div>` : '';
  const banner = bannerFor(entry);

  return `
  <div class="ticket-slide">
    <div class="ticket ${tClass}">
      ${banner.html}
      <div class="ticket-body">
        <div class="week-tag">Week ${entry.week}</div>
        ${interNote}
        <div class="matchup-row">
          <div class="logo-halo halo-${CONF[meName]}">${logoImg(meName, 72)}</div>
          <div class="matchup-vs">VS</div>
          <div class="logo-halo halo-${oppConf}">${logoImg(entry.opponent, 72)}</div>
        </div>
        <div class="matchup-names">
          <div class="matchup-name">${meName}</div>
          <div class="matchup-name">${entry.opponent}</div>
        </div>
        <div class="stat-line"><span class="stat-label">Series</span><span class="stat-value">${record}</span>
          <span class="conf-badge conf-${oppConf}" style="margin-left:auto">${oppConf}</span></div>
        ${entry.total_games>0 ? `
          <div class="dot-legend">
            <span><span class="legend-swatch" style="background:var(--win)"></span>Win</span>
            <span><span class="legend-swatch" style="background:var(--loss)"></span>Loss</span>
            <span>oldest &rarr; newest</span>
          </div>
          <div class="record-track">${dots}</div>` : ''}
        ${mostRecentHtml ? `<div class="stat-line"><span class="stat-label">Last time</span><span class="stat-value">${mostRecentHtml}</span></div>` : ''}
        ${closestHtml ? `<div class="stat-line"><span class="stat-label">Closest</span><span class="stat-value">${closestHtml}</span></div>` : ''}
        <div class="caption">${caption}</div>
      </div>
    </div>
  </div>`;
}

function selectManager(name){
  renderManagerChips(name);
  const content = document.getElementById('content');
  const schedule = MANAGERS_DATA[name];

  let html = `
    <div class="season-strip">
      <div class="season-name-row">
        ${logoImg(name, 30)}
        <div class="season-name">${name}</div>
      </div>
      <span class="conf-badge conf-${CONF[name]}">${CONF[name]}</span>
    </div>
    <div class="swipe-hint">Swipe to move through the season &rarr;</div>
    <div class="carousel" id="carousel">`;

  schedule.forEach(entry=>{ html += renderTicket(entry, name); });
  html += `</div><div class="progress" id="progress"></div>`;
  content.innerHTML = html;

  const progress = document.getElementById('progress');
  schedule.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'pdot' + (i===0 ? ' active' : '');
    progress.appendChild(d);
  });

  const carousel = document.getElementById('carousel');
  const slides = carousel.querySelectorAll('.ticket-slide');
  const tickets = carousel.querySelectorAll('.ticket');
  const dots = progress.querySelectorAll('.pdot');
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      const idx = Array.from(slides).indexOf(e.target);
      const ticketEl = tickets[idx];
      if(e.isIntersecting && e.intersectionRatio > 0.6){
        ticketEl.classList.add('active-card');
        dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
      } else {
        ticketEl.classList.remove('active-card');
      }
    });
  }, {root: carousel, threshold:[0.6]});
  slides.forEach(s=>observer.observe(s));
}

fetch(DATA_URL).then(r=>r.json()).then(data=>{
  MANAGERS_DATA = data;
  MANAGERS = Object.keys(data).sort((a,b)=> a.split(' ')[0].localeCompare(b.split(' ')[0]));
  renderManagerChips(null);
  document.getElementById('content').innerHTML = `
    <div class="placeholder">
      <div class="placeholder-emoji">2026</div>
      <div class="placeholder-text">Tap your name up top to pull up your full schedule, rivalry history, and the games with real history behind them.</div>
    </div>`;
}).catch(err=>{
  document.getElementById('content').innerHTML = `<div class="placeholder"><div class="placeholder-text">Couldn't load schedule data from ${DATA_URL}. Check the data folder path.</div></div>`;
});
</script>
</body>
</html>
